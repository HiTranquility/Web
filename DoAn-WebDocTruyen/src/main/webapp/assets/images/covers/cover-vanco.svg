<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0414"/>
      <stop offset="45%" stop-color="#1e0933"/>
      <stop offset="100%" stop-color="#380e5e"/>
    </linearGradient>
    <linearGradient id="gold-text" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d946ef"/>
    </linearGradient>
    <radialGradient id="center-glow" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.38"/>
      <stop offset="60%" stop-color="#d946ef" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="800" fill="url(#bg-grad)"/>
  <rect width="600" height="800" fill="url(#center-glow)"/>

  <!-- Ornate Outer Border -->
  <rect x="20" y="20" width="560" height="760" rx="8" fill="none" stroke="#fbbf24" stroke-width="1.2" stroke-opacity="0.35"/>
  <rect x="26" y="26" width="548" height="748" rx="6" fill="none" stroke="#d946ef" stroke-width="0.8" stroke-opacity="0.25"/>

  <!-- Top Badge -->
  <rect x="180" y="46" width="240" height="30" rx="15" fill="#d946ef" fill-opacity="0.18" stroke="#d946ef" stroke-width="1.2"/>
  <text x="300" y="66" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="700" fill="#fbbf24" text-anchor="middle" letter-spacing="3">TIÊN HIỆP VÔ ĐỊCH</text>

  <!-- Thematic Vector Elements -->

          <!-- Chaos Nebula Rings -->
          <circle cx="300" cy="350" r="160" fill="none" stroke="#d946ef" stroke-width="1.8" stroke-dasharray="14 8" opacity="0.45"/>
          <circle cx="300" cy="350" r="130" fill="#a855f7" fill-opacity="0.12" stroke="#fbbf24" stroke-width="1"/>
          <!-- Primordial Beast Eyes & Horns -->
          <path d="M220 330 Q240 310 260 330 Q240 340 220 330 Z" fill="#fbbf24"/>
          <circle cx="240" cy="328" r="3" fill="#fff"/>
          <path d="M340 330 Q360 310 380 330 Q360 340 340 330 Z" fill="#fbbf24"/>
          <circle cx="360" cy="328" r="3" fill="#fff"/>
          <!-- Spanning Chaos Claws / Clashing Lightning -->
          <line x1="300" y1="160" x2="300" y2="520" stroke="#fbbf24" stroke-width="1.5" stroke-opacity="0.6"/>
          <polygon points="292,160 308,160 304,300 296,300" fill="#d946ef"/>
          <!-- Jagged peaks -->
          <path d="M-50 670 L160 520 L300 640 L450 500 L650 670 L650 800 L-50 800 Z" fill="#06020a" opacity="0.96"/>
        

  <!-- Title & Typography -->
  <text x="300" y="640" font-family="'Lora', 'Playfair Display', Georgia, serif" font-size="28" font-weight="700" fill="url(#gold-text)" text-anchor="middle" letter-spacing="1">VẠN CỔ ĐỆ NHẤT THẦN</text>
  <text x="300" y="675" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="600" fill="#9aa3b5" text-anchor="middle" letter-spacing="3">THẬP ĐẠI THÁI CỔ HỖN ĐỘN CỰ THÚ</text>

  <!-- Accent Divider -->
  <line x1="200" y1="702" x2="400" y2="702" stroke="#d946ef" stroke-width="2" stroke-opacity="0.6"/>

  <!-- Author Signature -->
  <text x="300" y="738" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="600" fill="#e8eaf0" text-anchor="middle" letter-spacing="2">TÁC GIẢ: MỘC MIÊN</text>
</svg>
