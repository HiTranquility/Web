<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#08101e"/>
      <stop offset="50%" stop-color="#132742"/>
      <stop offset="100%" stop-color="#243b55"/>
    </linearGradient>
    <radialGradient id="moon-glow" cx="68%" cy="28%" r="40%">
      <stop offset="0%" stop-color="#e0eafc" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#8baad4" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold-5" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f9ca24"/>
      <stop offset="50%" stop-color="#f0932b"/>
      <stop offset="100%" stop-color="#ffbe76"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="600" height="800" fill="url(#bg-5)"/>

  <!-- Moon -->
  <circle cx="410" cy="220" r="140" fill="url(#moon-glow)"/>
  <circle cx="410" cy="220" r="55" fill="#f5f6fa" opacity="0.85"/>
  <circle cx="430" cy="210" r="50" fill="#132742" opacity="0.92"/>

  <!-- Distant Mountains -->
  <path d="M-20 540 L120 380 L260 510 L420 350 L620 540 L620 800 L-20 800 Z" fill="#0c1726" opacity="0.85"/>

  <!-- Great Fortress Walls and Watchtowers -->
  <!-- Tower left -->
  <rect x="110" y="440" width="80" height="180" fill="#070c14"/>
  <polygon points="100,440 150,380 200,440" fill="#0a121d"/>
  <!-- Battlement notches left -->
  <rect x="115" y="430" width="16" height="12" fill="#070c14"/>
  <rect x="142" y="430" width="16" height="12" fill="#070c14"/>
  <rect x="169" y="430" width="16" height="12" fill="#070c14"/>

  <!-- Tower right -->
  <rect x="410" y="440" width="80" height="180" fill="#070c14"/>
  <polygon points="400,440 450,380 500,440" fill="#0a121d"/>
  <!-- Battlement notches right -->
  <rect x="415" y="430" width="16" height="12" fill="#070c14"/>
  <rect x="442" y="430" width="16" height="12" fill="#070c14"/>
  <rect x="469" y="430" width="16" height="12" fill="#070c14"/>

  <!-- Main Wall Connecting -->
  <rect x="180" y="490" width="240" height="130" fill="#05080e"/>
  <!-- Battlements -->
  <rect x="195" y="480" width="20" height="12" fill="#05080e"/>
  <rect x="235" y="480" width="20" height="12" fill="#05080e"/>
  <rect x="275" y="480" width="20" height="12" fill="#05080e"/>
  <rect x="315" y="480" width="20" height="12" fill="#05080e"/>
  <rect x="355" y="480" width="20" height="12" fill="#05080e"/>
  <rect x="385" y="480" width="20" height="12" fill="#05080e"/>

  <!-- Castle Arch Gate -->
  <path d="M265 620 L265 550 Q300 520 335 550 L335 620 Z" fill="#f0932b" fill-opacity="0.3"/>

  <!-- Flying Flags -->
  <line x1="150" y1="380" x2="150" y2="340" stroke="#f0932b" stroke-width="2"/>
  <polygon points="150,340 185,355 150,370" fill="#f0932b"/>
  <line x1="450" y1="380" x2="450" y2="340" stroke="#f0932b" stroke-width="2"/>
  <polygon points="450,340 485,355 450,370" fill="#f0932b"/>

  <!-- Snowflakes -->
  <circle cx="90" cy="180" r="2.5" fill="#fff" opacity="0.8"/>
  <circle cx="210" cy="240" r="3" fill="#fff" opacity="0.9"/>
  <circle cx="340" cy="160" r="2" fill="#fff" opacity="0.75"/>
  <circle cx="520" cy="290" r="2.5" fill="#fff" opacity="0.85"/>
  <circle cx="280" cy="380" r="2" fill="#fff" opacity="0.7"/>
  <circle cx="160" cy="330" r="1.5" fill="#fff" opacity="0.6"/>

  <!-- Top Badge -->
  <rect x="210" y="48" width="180" height="28" rx="14" fill="#f9ca24" fill-opacity="0.15" stroke="#f9ca24" stroke-width="1"/>
  <text x="300" y="67" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="700" fill="#f9ca24" text-anchor="middle" letter-spacing="3">LỊCH SỬ · XUYÊN KHÔNG</text>

  <!-- Title & Typography -->
  <text x="300" y="650" font-family="'Lora', 'Playfair Display', Georgia, serif" font-size="34" font-weight="700" fill="url(#gold-5)" text-anchor="middle" letter-spacing="1">TA CÓ MỘT TOÀ THÀNH</text>
  <text x="300" y="688" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="500" fill="#c7ecee" text-anchor="middle" letter-spacing="3">TRANH BÁ LOẠN THẾ XÂY CƠ ĐỒ</text>

  <!-- Divider -->
  <line x1="210" y1="712" x2="390" y2="712" stroke="#f9ca24" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Author -->
  <text x="300" y="746" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="15" font-weight="600" fill="#f5f6fa" text-anchor="middle" letter-spacing="2">TÁC GIẢ: KIẾM VŨ</text>

  <!-- Frame border -->
  <rect x="20" y="20" width="560" height="760" rx="8" fill="none" stroke="#f9ca24" stroke-width="1.2" stroke-opacity="0.35"/>
  <rect x="26" y="26" width="548" height="748" rx="6" fill="none" stroke="#81ecec" stroke-width="0.6" stroke-opacity="0.2"/>
</svg>
