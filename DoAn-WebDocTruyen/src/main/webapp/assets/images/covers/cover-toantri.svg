<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050b14"/>
      <stop offset="50%" stop-color="#0a192f"/>
      <stop offset="100%" stop-color="#172a45"/>
    </linearGradient>
    <linearGradient id="gold-text" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#64ffda"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>
    <radialGradient id="center-glow" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#0070f3" stop-opacity="0.38"/>
      <stop offset="60%" stop-color="#00f0ff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="800" fill="url(#bg-grad)"/>
  <rect width="600" height="800" fill="url(#center-glow)"/>

  <!-- Ornate Outer Border -->
  <rect x="20" y="20" width="560" height="760" rx="8" fill="none" stroke="#64ffda" stroke-width="1.2" stroke-opacity="0.35"/>
  <rect x="26" y="26" width="548" height="748" rx="6" fill="none" stroke="#00f0ff" stroke-width="0.8" stroke-opacity="0.25"/>

  <!-- Top Badge -->
  <rect x="180" y="46" width="240" height="30" rx="15" fill="#00f0ff" fill-opacity="0.18" stroke="#00f0ff" stroke-width="1.2"/>
  <text x="300" y="66" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="700" fill="#64ffda" text-anchor="middle" letter-spacing="3">SIÊU PHẨM SINH TỒN</text>

  <!-- Thematic Vector Elements -->

          <!-- Constellation Grid & Nodes -->
          <circle cx="300" cy="350" r="160" fill="none" stroke="#0070f3" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="5 5"/>
          <circle cx="300" cy="350" r="110" fill="none" stroke="#00f0ff" stroke-width="1.5" stroke-opacity="0.4"/>
          <!-- Holographic Window Screen -->
          <rect x="180" y="270" width="240" height="150" rx="6" fill="#0a192f" fill-opacity="0.75" stroke="#00f0ff" stroke-width="1.8"/>
          <line x1="200" y1="310" x2="360" y2="310" stroke="#64ffda" stroke-width="2" stroke-linecap="round"/>
          <line x1="200" y1="335" x2="330" y2="335" stroke="#0070f3" stroke-width="2" stroke-linecap="round"/>
          <line x1="200" y1="360" x2="380" y2="360" stroke="#64ffda" stroke-width="2" stroke-linecap="round"/>
          <circle cx="390" cy="290" r="4" fill="#00f0ff"/>
          <!-- Digital Particles -->
          <circle cx="160" cy="200" r="3" fill="#64ffda"/>
          <circle cx="430" cy="240" r="2.5" fill="#00f0ff"/>
          <circle cx="140" cy="480" r="2" fill="#0070f3"/>
          <circle cx="460" cy="440" r="3.5" fill="#64ffda"/>
          <!-- Apocalyptic skyline horizon -->
          <path d="M-50 690 L120 580 L220 630 L380 560 L500 640 L650 590 L650 800 L-50 800 Z" fill="#03070d" opacity="0.95"/>
        

  <!-- Title & Typography -->
  <text x="300" y="640" font-family="'Lora', 'Playfair Display', Georgia, serif" font-size="28" font-weight="700" fill="url(#gold-text)" text-anchor="middle" letter-spacing="1">TOÀN TRÍ ĐỘC GIẢ</text>
  <text x="300" y="675" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="600" fill="#9aa3b5" text-anchor="middle" letter-spacing="3">OMNISCIENT READER'S VIEWPOINT</text>

  <!-- Accent Divider -->
  <line x1="200" y1="702" x2="400" y2="702" stroke="#00f0ff" stroke-width="2" stroke-opacity="0.6"/>

  <!-- Author Signature -->
  <text x="300" y="738" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="600" fill="#e8eaf0" text-anchor="middle" letter-spacing="2">TÁC GIẢ: MỘC MIÊN</text>
</svg>
