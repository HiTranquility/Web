<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180905"/>
      <stop offset="45%" stop-color="#2a110a"/>
      <stop offset="100%" stop-color="#4a1c0d"/>
    </linearGradient>
    <linearGradient id="gold-text" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#ffd000"/>
      <stop offset="100%" stop-color="#ff5400"/>
    </linearGradient>
    <radialGradient id="center-glow" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#ff8500" stop-opacity="0.38"/>
      <stop offset="60%" stop-color="#ff5400" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="800" fill="url(#bg-grad)"/>
  <rect width="600" height="800" fill="url(#center-glow)"/>

  <!-- Ornate Outer Border -->
  <rect x="20" y="20" width="560" height="760" rx="8" fill="none" stroke="#ffd000" stroke-width="1.2" stroke-opacity="0.35"/>
  <rect x="26" y="26" width="548" height="748" rx="6" fill="none" stroke="#ff5400" stroke-width="0.8" stroke-opacity="0.25"/>

  <!-- Top Badge -->
  <rect x="180" y="46" width="240" height="30" rx="15" fill="#ff5400" fill-opacity="0.18" stroke="#ff5400" stroke-width="1.2"/>
  <text x="300" y="66" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffd000" text-anchor="middle" letter-spacing="3">VÕNG DU ĐỈNH CAO</text>

  <!-- Thematic Vector Elements -->

          <!-- Molten Aura -->
          <circle cx="300" cy="370" r="150" fill="#ff5400" fill-opacity="0.15" stroke="#ff8500" stroke-width="1.5" stroke-dasharray="8 6"/>
          <!-- Legendary Anvil & Hammer -->
          <polygon points="220,480 380,480 350,530 250,530" fill="#180905" stroke="#ff8500" stroke-width="2"/>
          <polygon points="240,440 360,440 380,480 220,480" fill="#2a110a" stroke="#ffd000" stroke-width="2"/>
          <!-- Hammer Silhouette -->
          <polygon points="280,240 370,180 390,210 300,270" fill="#ffd000"/>
          <polygon points="240,290 310,240 295,220 225,270" fill="#ff5400"/>
          <line x1="280" y1="260" x2="160" y2="420" stroke="#ffd000" stroke-width="8" stroke-linecap="round"/>
          <!-- Forging Sparks -->
          <circle cx="280" cy="380" r="4" fill="#fff"/>
          <circle cx="320" cy="360" r="3" fill="#ffd000"/>
          <circle cx="340" cy="400" r="3.5" fill="#ff5400"/>
          <circle cx="260" cy="420" r="2.5" fill="#ffd000"/>
          <path d="M-50 680 L200 620 L400 650 L650 600 L650 800 L-50 800 Z" fill="#0d0402" opacity="0.95"/>
        

  <!-- Title & Typography -->
  <text x="300" y="640" font-family="'Lora', 'Playfair Display', Georgia, serif" font-size="28" font-weight="700" fill="url(#gold-text)" text-anchor="middle" letter-spacing="1">THỢ RÈN HUYỀN THOẠI</text>
  <text x="300" y="675" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="600" fill="#9aa3b5" text-anchor="middle" letter-spacing="3">OVERGEARED · BẬC THẦY RÈN ĐÚC</text>

  <!-- Accent Divider -->
  <line x1="200" y1="702" x2="400" y2="702" stroke="#ff5400" stroke-width="2" stroke-opacity="0.6"/>

  <!-- Author Signature -->
  <text x="300" y="738" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="600" fill="#e8eaf0" text-anchor="middle" letter-spacing="2">TÁC GIẢ: MỘC MIÊN</text>
</svg>
