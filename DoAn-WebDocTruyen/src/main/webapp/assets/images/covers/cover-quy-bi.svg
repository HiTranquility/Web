<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0b14"/>
      <stop offset="45%" stop-color="#1e132b"/>
      <stop offset="100%" stop-color="#3b173e"/>
    </linearGradient>
    <linearGradient id="gold-text" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#e0a96d"/>
      <stop offset="100%" stop-color="#e63946"/>
    </linearGradient>
    <radialGradient id="center-glow" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#9d0208" stop-opacity="0.38"/>
      <stop offset="60%" stop-color="#e63946" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="800" fill="url(#bg-grad)"/>
  <rect width="600" height="800" fill="url(#center-glow)"/>

  <!-- Ornate Outer Border -->
  <rect x="20" y="20" width="560" height="760" rx="8" fill="none" stroke="#e0a96d" stroke-width="1.2" stroke-opacity="0.35"/>
  <rect x="26" y="26" width="548" height="748" rx="6" fill="none" stroke="#e63946" stroke-width="0.8" stroke-opacity="0.25"/>

  <!-- Top Badge -->
  <rect x="180" y="46" width="240" height="30" rx="15" fill="#e63946" fill-opacity="0.18" stroke="#e63946" stroke-width="1.2"/>
  <text x="300" y="66" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="700" fill="#e0a96d" text-anchor="middle" letter-spacing="3">HUYỀN HUYỄN VICTORIA</text>

  <!-- Thematic Vector Elements -->

          <!-- Crimson Moon -->
          <circle cx="300" cy="360" r="140" fill="none" stroke="#e63946" stroke-width="2" stroke-opacity="0.4" stroke-dasharray="6 6"/>
          <circle cx="300" cy="360" r="110" fill="#9d0208" fill-opacity="0.25"/>
          <path d="M260 270 Q360 360 260 450 Q320 360 260 270 Z" fill="#e63946" opacity="0.6"/>
          <!-- Gears & Mechanism -->
          <circle cx="160" cy="220" r="45" fill="none" stroke="#e0a96d" stroke-width="2.5" stroke-dasharray="10 8" opacity="0.5"/>
          <circle cx="160" cy="220" r="20" fill="none" stroke="#e0a96d" stroke-width="1.5" opacity="0.4"/>
          <circle cx="440" cy="480" r="55" fill="none" stroke="#e0a96d" stroke-width="3" stroke-dasharray="12 10" opacity="0.45"/>
          <!-- Mystic Eye -->
          <circle cx="300" cy="360" r="28" fill="#0d0b14" stroke="#e0a96d" stroke-width="2"/>
          <circle cx="300" cy="360" r="12" fill="#e63946"/>
          <circle cx="296" cy="356" r="4" fill="#ffffff"/>
          <!-- Fog Tendrils -->
          <path d="M-50 700 Q150 630 300 680 T650 660 L650 800 L-50 800 Z" fill="#07060a" opacity="0.95"/>
          <path d="M-20 740 Q200 690 400 730 T620 710 L620 800 L-20 800 Z" fill="#130c1c" opacity="0.9"/>
        

  <!-- Title & Typography -->
  <text x="300" y="640" font-family="'Lora', 'Playfair Display', Georgia, serif" font-size="28" font-weight="700" fill="url(#gold-text)" text-anchor="middle" letter-spacing="1">QUỶ BÍ CHI CHỦ</text>
  <text x="300" y="675" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="600" fill="#9aa3b5" text-anchor="middle" letter-spacing="3">LORD OF THE MYSTERIES</text>

  <!-- Accent Divider -->
  <line x1="200" y1="702" x2="400" y2="702" stroke="#e63946" stroke-width="2" stroke-opacity="0.6"/>

  <!-- Author Signature -->
  <text x="300" y="738" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="600" fill="#e8eaf0" text-anchor="middle" letter-spacing="2">TÁC GIẢ: MỘC MIÊN</text>
</svg>
