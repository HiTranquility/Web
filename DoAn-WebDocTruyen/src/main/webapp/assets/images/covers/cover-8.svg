<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-8" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e272e"/>
      <stop offset="45%" stop-color="#3d3d3d"/>
      <stop offset="75%" stop-color="#574b90"/>
      <stop offset="100%" stop-color="#f78fb3"/>
    </linearGradient>
    <radialGradient id="twilight-sun" cx="50%" cy="55%" r="42%">
      <stop offset="0%" stop-color="#f7d794" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#e77f67" stop-opacity="0.5"/>
      <stop offset="80%" stop-color="#574b90" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rose-gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f7d794"/>
      <stop offset="100%" stop-color="#f78fb3"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="600" height="800" fill="url(#bg-8)"/>
  <circle cx="300" cy="440" r="210" fill="url(#twilight-sun)"/>

  <!-- Starry Constellations & Flight Trails -->
  <path d="M120 540 Q250 440 370 290 T480 180" fill="none" stroke="#f7d794" stroke-width="1.8" stroke-dasharray="6 6" opacity="0.75"/>
  <circle cx="480" cy="180" r="4" fill="#fff"/>
  <circle cx="370" cy="290" r="3" fill="#f7d794"/>
  <circle cx="250" cy="440" r="2.5" fill="#f78fb3"/>

  <!-- Vintage Letter / Envelope with Wax Seal -->
  <g transform="translate(195, 340)">
    <!-- Envelope body -->
    <rect x="0" y="0" width="210" height="135" rx="6" fill="#f5f6fa" stroke="#dcdde1" stroke-width="1.5" filter="drop-shadow(0 12px 24px rgba(0,0,0,0.5))"/>
    <!-- Fold lines -->
    <polygon points="0,0 105,75 210,0" fill="#f1f2f6" stroke="#dcdde1" stroke-width="1"/>
    <line x1="0" y1="135" x2="80" y2="60" stroke="#dcdde1" stroke-width="1"/>
    <line x1="210" y1="135" x2="130" y2="60" stroke="#dcdde1" stroke-width="1"/>
    <!-- Red Wax Seal -->
    <circle cx="105" cy="75" r="22" fill="#c44569"/>
    <circle cx="105" cy="75" r="18" fill="none" stroke="#e66767" stroke-width="1.5"/>
    <text x="105" y="81" font-family="'Lora', serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">10</text>
  </g>

  <!-- Soaring Paper Airplane -->
  <g transform="translate(360, 240) rotate(-22)">
    <polygon points="0,40 70,0 25,25" fill="#ffffff" filter="drop-shadow(0 4px 10px rgba(0,0,0,0.4))"/>
    <polygon points="25,25 70,0 35,45" fill="#f1f2f6"/>
    <polygon points="25,25 35,45 28,52" fill="#dcdde1"/>
  </g>

  <!-- School / City Horizon Silhouettes -->
  <path d="M0 620 L90 590 L180 610 L280 580 L400 615 L510 595 L600 620 L600 800 L0 800 Z" fill="#1e272e" opacity="0.95"/>
  <path d="M0 650 L120 635 L260 645 L420 630 L600 650 L600 800 L0 800 Z" fill="#0d1117" opacity="0.98"/>

  <!-- Glowing particles / memories -->
  <circle cx="140" cy="220" r="3" fill="#fff" opacity="0.9"/>
  <circle cx="430" cy="130" r="2" fill="#f7d794" opacity="0.8"/>
  <circle cx="180" cy="380" r="2.5" fill="#f78fb3" opacity="0.7"/>
  <circle cx="460" cy="360" r="3" fill="#f7d794" opacity="0.85"/>
  <circle cx="280" cy="190" r="2" fill="#fff" opacity="0.75"/>

  <!-- Top Badge -->
  <rect x="220" y="48" width="160" height="28" rx="14" fill="#f78fb3" fill-opacity="0.15" stroke="#f78fb3" stroke-width="1"/>
  <text x="300" y="67" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="700" fill="#f7d794" text-anchor="middle" letter-spacing="3">HOÀN THÀNH · ĐỜI THƯỜNG</text>

  <!-- Title & Typography -->
  <text x="300" y="650" font-family="'Lora', 'Playfair Display', Georgia, serif" font-size="34" font-weight="700" fill="url(#rose-gold)" text-anchor="middle" letter-spacing="1">THƯ GỬI 10 NĂM SAU</text>
  <text x="300" y="688" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="500" fill="#f3a683" text-anchor="middle" letter-spacing="3">LỜI HỨA CHƯA TỪNG LÃNG QUÊN</text>

  <!-- Divider -->
  <line x1="210" y1="712" x2="390" y2="712" stroke="#f78fb3" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Author -->
  <text x="300" y="746" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="15" font-weight="600" fill="#f5f6fa" text-anchor="middle" letter-spacing="2">TÁC GIẢ: MỘC MIÊN</text>

  <!-- Frame border -->
  <rect x="20" y="20" width="560" height="760" rx="8" fill="none" stroke="#f78fb3" stroke-width="1.2" stroke-opacity="0.35"/>
  <rect x="26" y="26" width="548" height="748" rx="6" fill="none" stroke="#f7d794" stroke-width="0.6" stroke-opacity="0.2"/>
</svg>
