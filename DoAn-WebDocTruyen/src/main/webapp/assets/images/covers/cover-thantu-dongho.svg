<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a120b"/>
      <stop offset="45%" stop-color="#2b1d14"/>
      <stop offset="100%" stop-color="#3d2b1f"/>
    </linearGradient>
    <linearGradient id="gold-text" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#e9c46a"/>
      <stop offset="100%" stop-color="#d4a373"/>
    </linearGradient>
    <radialGradient id="center-glow" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#faedcd" stop-opacity="0.38"/>
      <stop offset="60%" stop-color="#d4a373" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="800" fill="url(#bg-grad)"/>
  <rect width="600" height="800" fill="url(#center-glow)"/>

  <!-- Ornate Outer Border -->
  <rect x="20" y="20" width="560" height="760" rx="8" fill="none" stroke="#e9c46a" stroke-width="1.2" stroke-opacity="0.35"/>
  <rect x="26" y="26" width="548" height="748" rx="6" fill="none" stroke="#d4a373" stroke-width="0.8" stroke-opacity="0.25"/>

  <!-- Top Badge -->
  <rect x="180" y="46" width="240" height="30" rx="15" fill="#d4a373" fill-opacity="0.18" stroke="#d4a373" stroke-width="1.2"/>
  <text x="300" y="66" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="700" fill="#e9c46a" text-anchor="middle" letter-spacing="3">TRINH THÁM CỔ ĐIỂN</text>

  <!-- Thematic Vector Elements -->

          <!-- Vintage Pocket Watch / Hourglass Rim -->
          <circle cx="300" cy="350" r="130" fill="#1a120b" stroke="#e9c46a" stroke-width="3"/>
          <circle cx="300" cy="350" r="115" fill="#2b1d14" stroke="#d4a373" stroke-width="1" stroke-dasharray="8 6"/>
          <!-- Hourglass Shape Inside -->
          <polygon points="240,280 360,280 300,350" fill="#d4a373" fill-opacity="0.3" stroke="#e9c46a" stroke-width="1.5"/>
          <polygon points="240,420 360,420 300,350" fill="#e9c46a" fill-opacity="0.4" stroke="#e9c46a" stroke-width="1.5"/>
          <!-- Magnifying Glass Handle -->
          <circle cx="380" cy="300" r="50" fill="none" stroke="#faedcd" stroke-width="4"/>
          <line x1="415" y1="335" x2="480" y2="400" stroke="#e9c46a" stroke-width="7" stroke-linecap="round"/>
          <path d="M-50 680 Q180 620 320 660 T650 630 L650 800 L-50 800 Z" fill="#0f0a06" opacity="0.96"/>
        

  <!-- Title & Typography -->
  <text x="300" y="640" font-family="'Lora', 'Playfair Display', Georgia, serif" font-size="28" font-weight="700" fill="url(#gold-text)" text-anchor="middle" letter-spacing="1">VỤ ÁN ĐỒNG HỒ CÁT</text>
  <text x="300" y="675" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="600" fill="#9aa3b5" text-anchor="middle" letter-spacing="3">THÁM TỬ KÍNH LÚP LUÂN ĐÔN 1888</text>

  <!-- Accent Divider -->
  <line x1="200" y1="702" x2="400" y2="702" stroke="#d4a373" stroke-width="2" stroke-opacity="0.6"/>

  <!-- Author Signature -->
  <text x="300" y="738" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="600" fill="#e8eaf0" text-anchor="middle" letter-spacing="2">TÁC GIẢ: MỘC MIÊN</text>
</svg>
