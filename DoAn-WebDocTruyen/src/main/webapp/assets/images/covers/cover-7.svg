<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c071d"/>
      <stop offset="50%" stop-color="#141838"/>
      <stop offset="100%" stop-color="#07201c"/>
    </linearGradient>
    <radialGradient id="jade-portal" cx="50%" cy="38%" r="48%">
      <stop offset="0%" stop-color="#2bb789" stop-opacity="0.85"/>
      <stop offset="35%" stop-color="#8b7cf6" stop-opacity="0.45"/>
      <stop offset="70%" stop-color="#0c071d" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="jade-gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2bb789"/>
      <stop offset="50%" stop-color="#ffd56b"/>
      <stop offset="100%" stop-color="#8b7cf6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="800" fill="url(#bg-7)"/>
  <circle cx="300" cy="340" r="230" fill="url(#jade-portal)"/>

  <!-- Celestial Bagua & Talisman Seal Rings -->
  <circle cx="300" cy="340" r="160" fill="none" stroke="#2bb789" stroke-width="2" stroke-opacity="0.5" stroke-dasharray="12 8"/>
  <circle cx="300" cy="340" r="130" fill="none" stroke="#ffd56b" stroke-width="1.5" stroke-opacity="0.6"/>
  <circle cx="300" cy="340" r="95" fill="none" stroke="#8b7cf6" stroke-width="1" stroke-opacity="0.5" stroke-dasharray="6 6"/>

  <!-- 8 Trigrams (Trận đồ Bát Quái / Trấn Yêu) -->
  <g stroke="#ffd56b" stroke-width="3" stroke-linecap="round" opacity="0.75">
    <!-- Top -->
    <line x1="285" y1="195" x2="315" y2="195"/>
    <line x1="285" y1="202" x2="315" y2="202"/>
    <line x1="285" y1="209" x2="315" y2="209"/>
    <!-- Bottom -->
    <line x1="285" y1="471" x2="315" y2="471"/>
    <line x1="285" y1="478" x2="315" y2="478"/>
    <line x1="285" y1="485" x2="315" y2="485"/>
    <!-- Left -->
    <line x1="155" y1="330" x2="155" y2="350"/>
    <line x1="162" y1="330" x2="162" y2="350"/>
    <line x1="169" y1="330" x2="169" y2="350"/>
    <!-- Right -->
    <line x1="431" y1="330" x2="431" y2="350"/>
    <line x1="438" y1="330" x2="438" y2="350"/>
    <line x1="445" y1="330" x2="445" y2="350"/>
  </g>

  <!-- Yellow Talisman Paper (Lá bùa trấn trạch) floating in center -->
  <g transform="rotate(4 300 340)">
    <rect x="268" y="270" width="64" height="140" rx="3" fill="#fed330" stroke="#f39c12" stroke-width="1.5"/>
    <!-- Talisman Runes -->
    <path d="M280 290 L320 290 L300 315 L320 340 L280 340" fill="none" stroke="#eb3b5a" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="300" cy="360" r="8" fill="none" stroke="#eb3b5a" stroke-width="2"/>
    <path d="M290 380 Q300 395 310 380" fill="none" stroke="#eb3b5a" stroke-width="2.5"/>
  </g>

  <!-- Demon Mist & Swirling Spirit Flames -->
  <path d="M0 600 Q150 530 300 580 T600 560 L600 800 L0 800 Z" fill="#080c14" opacity="0.95"/>
  <circle cx="160" cy="270" r="3.5" fill="#2bb789" opacity="0.8"/>
  <circle cx="430" cy="250" r="3" fill="#8b7cf6" opacity="0.9"/>
  <circle cx="190" cy="410" r="2.5" fill="#ffd56b" opacity="0.85"/>
  <circle cx="420" cy="420" r="3" fill="#2bb789" opacity="0.75"/>
  <circle cx="290" cy="210" r="2" fill="#fff" opacity="0.9"/>

  <!-- Top Badge -->
  <rect x="220" y="48" width="160" height="28" rx="14" fill="#2bb789" fill-opacity="0.15" stroke="#2bb789" stroke-width="1"/>
  <text x="300" y="67" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="700" fill="#2bb789" text-anchor="middle" letter-spacing="3">HUYỀN HUYỄN DỊ GIỚI</text>

  <!-- Title & Typography -->
  <text x="300" y="650" font-family="'Lora', 'Playfair Display', Georgia, serif" font-size="38" font-weight="700" fill="url(#jade-gold)" text-anchor="middle" letter-spacing="2">TRẤN YÊU LỤC</text>
  <text x="300" y="688" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="500" fill="#a5b1c2" text-anchor="middle" letter-spacing="3">BA MƯƠI NĂM TRANH ĐẤU CÕI ÂM DƯƠNG</text>

  <!-- Divider -->
  <line x1="210" y1="712" x2="390" y2="712" stroke="#2bb789" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Author -->
  <text x="300" y="746" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="15" font-weight="600" fill="#f5f6fa" text-anchor="middle" letter-spacing="2">TÁC GIẢ: KIẾM VŨ</text>

  <!-- Frame border -->
  <rect x="20" y="20" width="560" height="760" rx="8" fill="none" stroke="#2bb789" stroke-width="1.2" stroke-opacity="0.35"/>
  <rect x="26" y="26" width="548" height="748" rx="6" fill="none" stroke="#ffd56b" stroke-width="0.6" stroke-opacity="0.2"/>
</svg>
