<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141416"/>
      <stop offset="45%" stop-color="#212126"/>
      <stop offset="100%" stop-color="#303038"/>
    </linearGradient>
    <linearGradient id="gold-text" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <radialGradient id="center-glow" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#b91c1c" stop-opacity="0.38"/>
      <stop offset="60%" stop-color="#ef4444" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="800" fill="url(#bg-grad)"/>
  <rect width="600" height="800" fill="url(#center-glow)"/>

  <!-- Ornate Outer Border -->
  <rect x="20" y="20" width="560" height="760" rx="8" fill="none" stroke="#fef08a" stroke-width="1.2" stroke-opacity="0.35"/>
  <rect x="26" y="26" width="548" height="748" rx="6" fill="none" stroke="#ef4444" stroke-width="0.8" stroke-opacity="0.25"/>

  <!-- Top Badge -->
  <rect x="180" y="46" width="240" height="30" rx="15" fill="#ef4444" fill-opacity="0.18" stroke="#ef4444" stroke-width="1.2"/>
  <text x="300" y="66" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="700" fill="#fef08a" text-anchor="middle" letter-spacing="3">KIẾM HIỆP CỔ ĐIỂN</text>

  <!-- Thematic Vector Elements -->

          <!-- Crimson Martial Sun -->
          <circle cx="300" cy="340" r="120" fill="#ef4444" fill-opacity="0.35" stroke="#ef4444" stroke-width="2"/>
          <circle cx="300" cy="340" r="90" fill="#b91c1c" fill-opacity="0.5"/>
          <!-- Mystic Black Book (Hắc Thư) Floating -->
          <polygon points="230,300 290,260 370,300 310,340" fill="#141416" stroke="#fef08a" stroke-width="1.8"/>
          <polygon points="230,300 310,340 310,380 230,340" fill="#0c0c0e" stroke="#fef08a" stroke-width="1.2"/>
          <polygon points="370,300 310,340 310,380 370,340" fill="#1d1d21" stroke="#fef08a" stroke-width="1.2"/>
          <!-- Aura lines -->
          <line x1="300" y1="180" x2="300" y2="240" stroke="#fef08a" stroke-width="1.5" stroke-dasharray="4 4"/>
          <!-- Mountain Ranges -->
          <path d="M-50 680 L140 490 L270 630 L420 460 L650 680 L650 800 L-50 800 Z" fill="#09090b" opacity="0.97"/>
        

  <!-- Title & Typography -->
  <text x="300" y="640" font-family="'Lora', 'Playfair Display', Georgia, serif" font-size="28" font-weight="700" fill="url(#gold-text)" text-anchor="middle" letter-spacing="1">VÕ LUYỆN ĐỈNH PHONG</text>
  <text x="300" y="675" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="600" fill="#9aa3b5" text-anchor="middle" letter-spacing="3">ĐỘC BỘ VÕ ĐẠO · KHỔ TU BẤT DIỆT</text>

  <!-- Accent Divider -->
  <line x1="200" y1="702" x2="400" y2="702" stroke="#ef4444" stroke-width="2" stroke-opacity="0.6"/>

  <!-- Author Signature -->
  <text x="300" y="738" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="600" fill="#e8eaf0" text-anchor="middle" letter-spacing="2">TÁC GIẢ: MỘC MIÊN</text>
</svg>
