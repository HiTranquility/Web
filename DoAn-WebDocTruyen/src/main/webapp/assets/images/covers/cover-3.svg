<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0c10"/>
      <stop offset="60%" stop-color="#121622"/>
      <stop offset="100%" stop-color="#1f101b"/>
    </linearGradient>
    <linearGradient id="red-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4757"/>
      <stop offset="100%" stop-color="#c0392b"/>
    </linearGradient>
    <radialGradient id="spotlight" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#e5576f" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="800" fill="url(#bg-3)"/>
  <rect width="600" height="800" fill="url(#spotlight)"/>

  <!-- Fingerprint / Grid motif -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="100" x2="600" y2="100"/>
    <line x1="0" y1="200" x2="600" y2="200"/>
    <line x1="0" y1="300" x2="600" y2="300"/>
    <line x1="0" y1="400" x2="600" y2="400"/>
    <line x1="0" y1="500" x2="600" y2="500"/>
    <line x1="100" y1="0" x2="100" y2="800"/>
    <line x1="200" y1="0" x2="200" y2="800"/>
    <line x1="300" y1="0" x2="300" y2="800"/>
    <line x1="400" y1="0" x2="400" y2="800"/>
    <line x1="500" y1="0" x2="500" y2="800"/>
  </g>

  <!-- Giant Mystical Clock (Stopped at 3:14) -->
  <circle cx="300" cy="360" r="140" fill="#0b0d13" stroke="#e5576f" stroke-width="2" stroke-opacity="0.4"/>
  <circle cx="300" cy="360" r="130" fill="none" stroke="#fff" stroke-width="0.8" stroke-opacity="0.15" stroke-dasharray="4 6"/>
  <circle cx="300" cy="360" r="105" fill="none" stroke="#e5576f" stroke-width="1" stroke-opacity="0.25"/>

  <!-- Clock tick marks -->
  <line x1="300" y1="230" x2="300" y2="242" stroke="#e5576f" stroke-width="3"/>
  <line x1="300" y1="490" x2="300" y2="478" stroke="#e5576f" stroke-width="3"/>
  <line x1="170" y1="360" x2="182" y2="360" stroke="#e5576f" stroke-width="3"/>
  <line x1="430" y1="360" x2="418" y2="360" stroke="#e5576f" stroke-width="3"/>

  <!-- Clock Hands pointing to 03:14 -->
  <!-- Hour hand ~3:14 -->
  <line x1="300" y1="360" x2="385" y2="388" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
  <!-- Minute hand ~14 min -->
  <line x1="300" y1="360" x2="405" y2="320" stroke="#ff4757" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Center cap -->
  <circle cx="300" cy="360" r="8" fill="#ff4757"/>

  <!-- Crime scene tape style accent banner -->
  <g transform="rotate(-6 300 480)">
    <rect x="80" y="470" width="440" height="28" fill="#ff4757" fill-opacity="0.9"/>
    <text x="300" y="489" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="800" fill="#0b0c10" text-anchor="middle" letter-spacing="4">HỒ SƠ TUYỆT MẬT · CẤM VÀO</text>
  </g>

  <!-- Top Badge -->
  <rect x="235" y="48" width="130" height="28" rx="14" fill="#ff4757" fill-opacity="0.15" stroke="#ff4757" stroke-width="1"/>
  <text x="300" y="67" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="700" fill="#ff4757" text-anchor="middle" letter-spacing="3">TRINH THÁM NOIR</text>

  <!-- Title & Typography -->
  <text x="300" y="650" font-family="'Lora', 'Playfair Display', Georgia, serif" font-size="36" font-weight="700" fill="url(#red-glow)" text-anchor="middle" letter-spacing="2">HỒ SƠ VỤ ÁN SỐ 7</text>
  <text x="300" y="688" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="500" fill="#a4b0be" text-anchor="middle" letter-spacing="3">CĂN PHÒNG KHÓA KÍN LÚC 03:14</text>

  <!-- Divider line -->
  <line x1="220" y1="712" x2="380" y2="712" stroke="#ff4757" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Author -->
  <text x="300" y="746" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="15" font-weight="600" fill="#dfe4ea" text-anchor="middle" letter-spacing="2">TÁC GIẢ: HẢI DƯƠNG</text>

  <!-- Outer frames -->
  <rect x="20" y="20" width="560" height="760" rx="8" fill="none" stroke="#ff4757" stroke-width="1.2" stroke-opacity="0.3"/>
  <rect x="26" y="26" width="548" height="748" rx="6" fill="none" stroke="#fff" stroke-width="0.6" stroke-opacity="0.15"/>
</svg>
