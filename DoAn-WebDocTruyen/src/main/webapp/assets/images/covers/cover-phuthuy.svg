<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0c26"/>
      <stop offset="45%" stop-color="#161947"/>
      <stop offset="100%" stop-color="#262a6e"/>
    </linearGradient>
    <linearGradient id="gold-text" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <radialGradient id="center-glow" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#a5b4fc" stop-opacity="0.38"/>
      <stop offset="60%" stop-color="#818cf8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="800" fill="url(#bg-grad)"/>
  <rect width="600" height="800" fill="url(#center-glow)"/>

  <!-- Ornate Outer Border -->
  <rect x="20" y="20" width="560" height="760" rx="8" fill="none" stroke="#c084fc" stroke-width="1.2" stroke-opacity="0.35"/>
  <rect x="26" y="26" width="548" height="748" rx="6" fill="none" stroke="#818cf8" stroke-width="0.8" stroke-opacity="0.25"/>

  <!-- Top Badge -->
  <rect x="180" y="46" width="240" height="30" rx="15" fill="#818cf8" fill-opacity="0.18" stroke="#818cf8" stroke-width="1.2"/>
  <text x="300" y="66" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="700" fill="#c084fc" text-anchor="middle" letter-spacing="3">MA PHÁP HUYỀN BÍ</text>

  <!-- Thematic Vector Elements -->

          <!-- Runic Magic Circle -->
          <circle cx="300" cy="350" r="150" fill="none" stroke="#818cf8" stroke-width="1.8" stroke-dasharray="10 8" opacity="0.5"/>
          <circle cx="300" cy="350" r="115" fill="#262a6e" fill-opacity="0.3" stroke="#c084fc" stroke-width="1.2"/>
          <!-- Floating Grimoire / Ancient Spellbook -->
          <polygon points="220,340 300,320 380,340 380,410 300,390 220,410" fill="#0b0c26" stroke="#c084fc" stroke-width="2"/>
          <line x1="300" y1="320" x2="300" y2="390" stroke="#818cf8" stroke-width="2"/>
          <!-- Floating Magic Wand & Sparks -->
          <line x1="180" y1="230" x2="320" y2="310" stroke="#c084fc" stroke-width="4" stroke-linecap="round"/>
          <circle cx="180" cy="230" r="10" fill="#fff" opacity="0.9"/>
          <!-- Magic Tower Spire Silhouette -->
          <polygon points="300,160 280,260 320,260" fill="#07071a"/>
          <path d="M-50 680 L180 590 L350 630 L520 570 L650 660 L650 800 L-50 800 Z" fill="#040513" opacity="0.96"/>
        

  <!-- Title & Typography -->
  <text x="300" y="640" font-family="'Lora', 'Playfair Display', Georgia, serif" font-size="28" font-weight="700" fill="url(#gold-text)" text-anchor="middle" letter-spacing="1">PHÙ THỦY CUỐI CÙNG</text>
  <text x="300" y="675" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="600" fill="#9aa3b5" text-anchor="middle" letter-spacing="3">HỌC VIỆN PHÉP THUẬT CỔ ĐẠI</text>

  <!-- Accent Divider -->
  <line x1="200" y1="702" x2="400" y2="702" stroke="#818cf8" stroke-width="2" stroke-opacity="0.6"/>

  <!-- Author Signature -->
  <text x="300" y="738" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="600" fill="#e8eaf0" text-anchor="middle" letter-spacing="2">TÁC GIẢ: MỘC MIÊN</text>
</svg>
