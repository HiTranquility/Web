<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="gold-text" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <radialGradient id="center-glow" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.38"/>
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="800" fill="url(#bg-grad)"/>
  <rect width="600" height="800" fill="url(#center-glow)"/>

  <!-- Ornate Outer Border -->
  <rect x="20" y="20" width="560" height="760" rx="8" fill="none" stroke="#facc15" stroke-width="1.2" stroke-opacity="0.35"/>
  <rect x="26" y="26" width="548" height="748" rx="6" fill="none" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.25"/>

  <!-- Top Badge -->
  <rect x="180" y="46" width="240" height="30" rx="15" fill="#38bdf8" fill-opacity="0.18" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="300" y="66" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="700" fill="#facc15" text-anchor="middle" letter-spacing="3">ĐÔ THỊ TU TIÊN</text>

  <!-- Thematic Vector Elements -->

          <!-- Celestial Dragon Swirl Over City -->
          <circle cx="300" cy="320" r="140" fill="#38bdf8" fill-opacity="0.08" stroke="#facc15" stroke-width="1.5" stroke-dasharray="8 6"/>
          <!-- Golden Flying Sword Beam -->
          <polygon points="296,150 304,150 307,480 293,480" fill="#facc15"/>
          <circle cx="300" cy="150" r="12" fill="#fff" opacity="0.8"/>
          <!-- Modern Skyscraper Silhouettes -->
          <rect x="80" y="450" width="60" height="250" fill="#080d1a"/>
          <rect x="160" y="410" width="70" height="290" fill="#0f172a"/>
          <rect x="250" y="470" width="50" height="230" fill="#080d1a"/>
          <rect x="320" y="390" width="80" height="310" fill="#0f172a"/>
          <rect x="420" y="430" width="65" height="270" fill="#080d1a"/>
          <!-- Window Dots -->
          <circle cx="180" cy="440" r="2" fill="#38bdf8"/>
          <circle cx="200" cy="460" r="2" fill="#facc15"/>
          <circle cx="340" cy="420" r="2" fill="#38bdf8"/>
          <circle cx="360" cy="450" r="2" fill="#facc15"/>
        

  <!-- Title & Typography -->
  <text x="300" y="640" font-family="'Lora', 'Playfair Display', Georgia, serif" font-size="28" font-weight="700" fill="url(#gold-text)" text-anchor="middle" letter-spacing="1">TRÙNG SINH ĐÔ THỊ TU TIÊN</text>
  <text x="300" y="675" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="600" fill="#9aa3b5" text-anchor="middle" letter-spacing="3">ĐỘ KIẾP TRỞ VỀ · BẮC HUYỀN TIÊN TÔN</text>

  <!-- Accent Divider -->
  <line x1="200" y1="702" x2="400" y2="702" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.6"/>

  <!-- Author Signature -->
  <text x="300" y="738" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="600" fill="#e8eaf0" text-anchor="middle" letter-spacing="2">TÁC GIẢ: MỘC MIÊN</text>
</svg>
