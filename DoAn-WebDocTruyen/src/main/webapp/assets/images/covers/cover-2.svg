<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#192a56"/>
      <stop offset="40%" stop-color="#273c75"/>
      <stop offset="68%" stop-color="#e84118"/>
      <stop offset="90%" stop-color="#fbc531"/>
      <stop offset="100%" stop-color="#4cd137"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="65%" r="35%">
      <stop offset="0%" stop-color="#fff"/>
      <stop offset="40%" stop-color="#fbc531"/>
      <stop offset="70%" stop-color="#e84118" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#e84118" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fbc531"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="600" height="800" fill="url(#bg-2)"/>

  <!-- Glowing Summer Sunset -->
  <circle cx="300" cy="520" r="160" fill="url(#sun)"/>

  <!-- Clouds / Horizon -->
  <ellipse cx="140" cy="460" rx="180" ry="25" fill="#fbc531" opacity="0.3"/>
  <ellipse cx="460" cy="490" rx="160" ry="20" fill="#e84118" opacity="0.4"/>

  <!-- Ocean Waves -->
  <path d="M0 580 Q150 565 300 580 T600 580 L600 800 L0 800 Z" fill="#192a56" opacity="0.95"/>
  <path d="M0 610 Q150 595 300 610 T600 610 L600 800 L0 800 Z" fill="#0c2461" opacity="0.98"/>

  <!-- Seaside Windmill / Lighthouse / Rail Silhouettes -->
  <path d="M60 580 L80 430 L100 580 Z" fill="#081026"/>
  <polygon points="76,430 84,430 86,410 74,410" fill="#fbc531"/>
  <!-- Light beam -->
  <polygon points="80,415 320,360 320,470" fill="#fff" opacity="0.12"/>

  <!-- Seaside Train Poles Silhouette -->
  <line x1="180" y1="580" x2="180" y2="480" stroke="#081026" stroke-width="4"/>
  <line x1="165" y1="500" x2="195" y2="500" stroke="#081026" stroke-width="3"/>
  <line x1="380" y1="580" x2="380" y2="460" stroke="#081026" stroke-width="4"/>
  <line x1="365" y1="480" x2="395" y2="480" stroke="#081026" stroke-width="3"/>
  <path d="M0 500 Q200 520 400 480 T600 490" fill="none" stroke="#081026" stroke-width="1.5" opacity="0.6"/>

  <!-- Petals / Sparkles -->
  <circle cx="220" cy="310" r="3" fill="#fff" opacity="0.8"/>
  <circle cx="380" cy="260" r="2.5" fill="#fbc531" opacity="0.9"/>
  <circle cx="450" cy="340" r="2" fill="#fff" opacity="0.7"/>
  <circle cx="160" cy="220" r="2" fill="#ffa801" opacity="0.7"/>

  <!-- Top Badge -->
  <rect x="225" y="48" width="150" height="28" rx="14" fill="#fff" fill-opacity="0.12" stroke="#fff" stroke-width="1" stroke-opacity="0.3"/>
  <text x="300" y="67" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="700" fill="#fbc531" text-anchor="middle" letter-spacing="3">THANH XUÂN VƯỜN TRƯỜNG</text>

  <!-- Title & Typography -->
  <text x="300" y="660" font-family="'Lora', 'Playfair Display', Georgia, serif" font-size="38" font-weight="700" fill="url(#title-grad)" text-anchor="middle" letter-spacing="1">MÙA HẠ NĂM ẤY</text>
  <text x="300" y="695" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="500" fill="#dcdde1" text-anchor="middle" letter-spacing="3">THỊ TRẤN VEN BIỂN &amp; LỜI HỨA</text>

  <!-- Divider -->
  <line x1="220" y1="718" x2="380" y2="718" stroke="#fbc531" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Author -->
  <text x="300" y="750" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="15" font-weight="600" fill="#f5f6fa" text-anchor="middle" letter-spacing="2">TÁC GIẢ: MỘC MIÊN</text>

  <!-- Frame border -->
  <rect x="20" y="20" width="560" height="760" rx="8" fill="none" stroke="#fbc531" stroke-width="1.2" stroke-opacity="0.35"/>
  <rect x="26" y="26" width="548" height="748" rx="6" fill="none" stroke="#fff" stroke-width="0.6" stroke-opacity="0.2"/>
</svg>
