<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#160303"/>
      <stop offset="45%" stop-color="#2b0808"/>
      <stop offset="100%" stop-color="#450e0e"/>
    </linearGradient>
    <linearGradient id="gold-text" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <radialGradient id="center-glow" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#f87171" stop-opacity="0.38"/>
      <stop offset="60%" stop-color="#dc2626" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="800" fill="url(#bg-grad)"/>
  <rect width="600" height="800" fill="url(#center-glow)"/>

  <!-- Ornate Outer Border -->
  <rect x="20" y="20" width="560" height="760" rx="8" fill="none" stroke="#fef08a" stroke-width="1.2" stroke-opacity="0.35"/>
  <rect x="26" y="26" width="548" height="748" rx="6" fill="none" stroke="#dc2626" stroke-width="0.8" stroke-opacity="0.25"/>

  <!-- Top Badge -->
  <rect x="180" y="46" width="240" height="30" rx="15" fill="#dc2626" fill-opacity="0.18" stroke="#dc2626" stroke-width="1.2"/>
  <text x="300" y="66" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="700" fill="#fef08a" text-anchor="middle" letter-spacing="3">KINH DỊ HỌC ĐƯỜNG</text>

  <!-- Thematic Vector Elements -->

          <!-- Blood Red Aura & Corridor Perspective -->
          <polygon points="60,180 540,180 430,560 170,560" fill="#0f0202" stroke="#dc2626" stroke-width="1.5" opacity="0.8"/>
          <!-- Heavy Weathered Door -->
          <rect x="230" y="240" width="140" height="260" fill="#1c0505" stroke="#f87171" stroke-width="2"/>
          <text x="300" y="320" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="28" font-weight="900" fill="#fef08a" text-anchor="middle">404</text>
          <!-- Crime Scene Caution Tapes (X crossing) -->
          <line x1="200" y1="330" x2="400" y2="430" stroke="#fef08a" stroke-width="6" stroke-opacity="0.7"/>
          <line x1="200" y1="430" x2="400" y2="330" stroke="#fef08a" stroke-width="6" stroke-opacity="0.7"/>
          <!-- Floor Blood Stain -->
          <ellipse cx="300" cy="560" rx="90" ry="18" fill="#dc2626" opacity="0.6"/>
          <path d="M-50 670 Q160 610 320 650 T650 620 L650 800 L-50 800 Z" fill="#0a0101" opacity="0.97"/>
        

  <!-- Title & Typography -->
  <text x="300" y="640" font-family="'Lora', 'Playfair Display', Georgia, serif" font-size="28" font-weight="700" fill="url(#gold-text)" text-anchor="middle" letter-spacing="1">CĂN PHÒNG SỐ 404</text>
  <text x="300" y="675" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="600" fill="#9aa3b5" text-anchor="middle" letter-spacing="3">ÁM ẢNH KÝ TÚC XÁ 15 NĂM NIÊM PHONG</text>

  <!-- Accent Divider -->
  <line x1="200" y1="702" x2="400" y2="702" stroke="#dc2626" stroke-width="2" stroke-opacity="0.6"/>

  <!-- Author Signature -->
  <text x="300" y="738" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="600" fill="#e8eaf0" text-anchor="middle" letter-spacing="2">TÁC GIẢ: MỘC MIÊN</text>
</svg>
