<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f0310"/>
      <stop offset="45%" stop-color="#380720"/>
      <stop offset="100%" stop-color="#570c32"/>
    </linearGradient>
    <linearGradient id="gold-text" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#be185d"/>
    </linearGradient>
    <radialGradient id="center-glow" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.38"/>
      <stop offset="60%" stop-color="#be185d" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="800" fill="url(#bg-grad)"/>
  <rect width="600" height="800" fill="url(#center-glow)"/>

  <!-- Ornate Outer Border -->
  <rect x="20" y="20" width="560" height="760" rx="8" fill="none" stroke="#fde047" stroke-width="1.2" stroke-opacity="0.35"/>
  <rect x="26" y="26" width="548" height="748" rx="6" fill="none" stroke="#be185d" stroke-width="0.8" stroke-opacity="0.25"/>

  <!-- Top Badge -->
  <rect x="180" y="46" width="240" height="30" rx="15" fill="#be185d" fill-opacity="0.18" stroke="#be185d" stroke-width="1.2"/>
  <text x="300" y="66" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="700" fill="#fde047" text-anchor="middle" letter-spacing="3">HOÀNG GIA TRỌNG SINH</text>

  <!-- Thematic Vector Elements -->

          <!-- Imperial Gilded Crown Silhouette -->
          <polygon points="220,380 230,300 260,340 300,280 340,340 370,300 380,380" fill="#fde047" stroke="#fff" stroke-width="2"/>
          <circle cx="300" cy="275" r="8" fill="#be185d"/>
          <circle cx="230" cy="295" r="6" fill="#be185d"/>
          <circle cx="370" cy="295" r="6" fill="#be185d"/>
          <!-- Royal Thorn & Roses Motif -->
          <path d="M200 430 Q300 480 400 430" fill="none" stroke="#fde047" stroke-width="2.5"/>
          <circle cx="250" cy="445" r="10" fill="#be185d" stroke="#fde047" stroke-width="1.5"/>
          <circle cx="350" cy="445" r="10" fill="#be185d" stroke="#fde047" stroke-width="1.5"/>
          <!-- Royal Palace Chandelier Silhouette -->
          <circle cx="300" cy="180" r="40" fill="none" stroke="#fde047" stroke-width="1.5" stroke-dasharray="6 4"/>
          <line x1="300" y1="120" x2="300" y2="180" stroke="#fde047" stroke-width="2"/>
          <path d="M-50 670 Q160 610 320 650 T650 620 L650 800 L-50 800 Z" fill="#0d0106" opacity="0.96"/>
        

  <!-- Title & Typography -->
  <text x="300" y="640" font-family="'Lora', 'Playfair Display', Georgia, serif" font-size="28" font-weight="700" fill="url(#gold-text)" text-anchor="middle" letter-spacing="1">TRỞ THÀNH BẠO CHÚA</text>
  <text x="300" y="675" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="600" fill="#9aa3b5" text-anchor="middle" letter-spacing="3">HOÀNG ĐẾ TRONG TIỂU THUYẾT LÃNG MẠN</text>

  <!-- Accent Divider -->
  <line x1="200" y1="702" x2="400" y2="702" stroke="#be185d" stroke-width="2" stroke-opacity="0.6"/>

  <!-- Author Signature -->
  <text x="300" y="738" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="600" fill="#e8eaf0" text-anchor="middle" letter-spacing="2">TÁC GIẢ: MỘC MIÊN</text>
</svg>
