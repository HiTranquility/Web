<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0b10"/>
      <stop offset="50%" stop-color="#191316"/>
      <stop offset="100%" stop-color="#2c141d"/>
    </linearGradient>
    <radialGradient id="lantern-glow" cx="50%" cy="38%" r="45%">
      <stop offset="0%" stop-color="#ff793f" stop-opacity="0.9"/>
      <stop offset="25%" stop-color="#cd6133" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#b33939" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title-glow-4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffb142"/>
      <stop offset="50%" stop-color="#ff5252"/>
      <stop offset="100%" stop-color="#ff793f"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="800" fill="url(#bg-4)"/>

  <!-- Moonlight / Lantern Aura -->
  <circle cx="300" cy="320" r="220" fill="url(#lantern-glow)"/>

  <!-- Traditional Tavern Roof Silhouettes -->
  <path d="M120 540 Q300 480 480 540 L450 565 Q300 520 150 565 Z" fill="#08090d"/>
  <path d="M160 460 Q300 420 440 460 L415 480 Q300 450 185 480 Z" fill="#08090d"/>

  <!-- Tavern Door / Warm Glow -->
  <rect x="240" y="540" width="120" height="180" fill="#ff793f" fill-opacity="0.35"/>
  <rect x="250" y="550" width="100" height="170" fill="#ffb142" fill-opacity="0.25"/>

  <!-- Glowing Hanging Lantern -->
  <!-- Lantern cord -->
  <line x1="300" y1="180" x2="300" y2="260" stroke="#cd6133" stroke-width="3"/>
  <!-- Lantern cap -->
  <path d="M260 260 Q300 250 340 260 L330 270 L270 270 Z" fill="#2c2c54"/>
  <!-- Lantern body -->
  <ellipse cx="300" cy="330" rx="55" ry="70" fill="#ff5252"/>
  <ellipse cx="300" cy="330" rx="42" ry="68" fill="#ff793f"/>
  <ellipse cx="300" cy="330" rx="20" ry="66" fill="#ffda79"/>
  <!-- Lantern ribs -->
  <path d="M300 260 L300 400" stroke="#b33939" stroke-width="2"/>
  <path d="M265 290 Q300 300 335 290" fill="none" stroke="#b33939" stroke-width="1.5"/>
  <path d="M255 330 Q300 340 345 330" fill="none" stroke="#b33939" stroke-width="1.5"/>
  <path d="M265 370 Q300 380 335 370" fill="none" stroke="#b33939" stroke-width="1.5"/>
  <!-- Lantern bottom tassel -->
  <rect x="288" y="400" width="24" height="10" fill="#2c2c54"/>
  <line x1="300" y1="410" x2="300" y2="465" stroke="#ff5252" stroke-width="4"/>

  <!-- Flying Embers -->
  <circle cx="210" cy="270" r="2.5" fill="#ffda79" opacity="0.85"/>
  <circle cx="390" cy="240" r="3" fill="#ff793f" opacity="0.9"/>
  <circle cx="170" cy="360" r="2" fill="#ffda79" opacity="0.7"/>
  <circle cx="430" cy="330" r="2.5" fill="#ff5252" opacity="0.8"/>
  <circle cx="370" cy="420" r="1.5" fill="#ffb142" opacity="0.75"/>

  <!-- Top Badge -->
  <rect x="225" y="48" width="150" height="28" rx="14" fill="#ff5252" fill-opacity="0.15" stroke="#ff5252" stroke-width="1"/>
  <text x="300" y="67" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="700" fill="#ff793f" text-anchor="middle" letter-spacing="3">HUYỀN BÍ DỊ THƯỜNG</text>

  <!-- Title & Typography -->
  <text x="300" y="650" font-family="'Lora', 'Playfair Display', Georgia, serif" font-size="36" font-weight="700" fill="url(#title-glow-4)" text-anchor="middle" letter-spacing="1">QUÁN TRỌ CUỐI ĐƯỜNG</text>
  <text x="300" y="688" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="500" fill="#aaa69d" text-anchor="middle" letter-spacing="3">NƠI DỪNG CHÂN GIỮA HAI CÕI</text>

  <!-- Divider -->
  <line x1="210" y1="712" x2="390" y2="712" stroke="#ff793f" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Author -->
  <text x="300" y="746" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="15" font-weight="600" fill="#f1f2f6" text-anchor="middle" letter-spacing="2">TÁC GIẢ: HẢI DƯƠNG</text>

  <!-- Frame border -->
  <rect x="20" y="20" width="560" height="760" rx="8" fill="none" stroke="#ff5252" stroke-width="1.2" stroke-opacity="0.3"/>
  <rect x="26" y="26" width="548" height="748" rx="6" fill="none" stroke="#ffb142" stroke-width="0.6" stroke-opacity="0.2"/>
</svg>
