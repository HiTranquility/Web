<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#041c14"/>
      <stop offset="45%" stop-color="#0b3829"/>
      <stop offset="100%" stop-color="#12543e"/>
    </linearGradient>
    <linearGradient id="gold-text" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <radialGradient id="center-glow" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.38"/>
      <stop offset="60%" stop-color="#10b981" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="800" fill="url(#bg-grad)"/>
  <rect width="600" height="800" fill="url(#center-glow)"/>

  <!-- Ornate Outer Border -->
  <rect x="20" y="20" width="560" height="760" rx="8" fill="none" stroke="#fbbf24" stroke-width="1.2" stroke-opacity="0.35"/>
  <rect x="26" y="26" width="548" height="748" rx="6" fill="none" stroke="#10b981" stroke-width="0.8" stroke-opacity="0.25"/>

  <!-- Top Badge -->
  <rect x="180" y="46" width="240" height="30" rx="15" fill="#10b981" fill-opacity="0.18" stroke="#10b981" stroke-width="1.2"/>
  <text x="300" y="66" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="700" fill="#fbbf24" text-anchor="middle" letter-spacing="3">ĐÔ THỊ THẦN Y</text>

  <!-- Thematic Vector Elements -->

          <!-- Bagua / Longevity Lotus Circle -->
          <circle cx="300" cy="350" r="140" fill="none" stroke="#10b981" stroke-width="2" stroke-dasharray="8 6" opacity="0.6"/>
          <circle cx="300" cy="350" r="100" fill="#10b981" fill-opacity="0.1" stroke="#fbbf24" stroke-width="1.5"/>
          <!-- Golden Acupuncture Needles -->
          <polygon points="298,170 302,170 301,470 299,470" fill="#fbbf24"/>
          <circle cx="300" cy="170" r="5" fill="#fff"/>
          <polygon points="230,220 234,220 270,440 267,440" fill="#fbbf24" opacity="0.75"/>
          <polygon points="368,220 372,220 332,440 329,440" fill="#fbbf24" opacity="0.75"/>
          <!-- Lotus Petals Silhouette -->
          <path d="M300 370 C270 330 270 410 300 430 C330 410 330 330 300 370 Z" fill="#34d399" opacity="0.8"/>
          <path d="M-50 670 Q160 620 320 660 T650 620 L650 800 L-50 800 Z" fill="#020f0a" opacity="0.96"/>
        

  <!-- Title & Typography -->
  <text x="300" y="640" font-family="'Lora', 'Playfair Display', Georgia, serif" font-size="28" font-weight="700" fill="url(#gold-text)" text-anchor="middle" letter-spacing="1">Y ĐẠO VÔ SONG</text>
  <text x="300" y="675" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="600" fill="#9aa3b5" text-anchor="middle" letter-spacing="3">THẦN Y HẠ SƠN · CỨU NHÂN ĐỘ THẾ</text>

  <!-- Accent Divider -->
  <line x1="200" y1="702" x2="400" y2="702" stroke="#10b981" stroke-width="2" stroke-opacity="0.6"/>

  <!-- Author Signature -->
  <text x="300" y="738" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="600" fill="#e8eaf0" text-anchor="middle" letter-spacing="2">TÁC GIẢ: MỘC MIÊN</text>
</svg>
