<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-6" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#050608"/>
      <stop offset="60%" stop-color="#14171f"/>
      <stop offset="100%" stop-color="#2c303d"/>
    </linearGradient>
    <radialGradient id="ink-splash" cx="50%" cy="40%" r="48%">
      <stop offset="0%" stop-color="#485460" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#1e272e" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="silver-title" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#d2dae2"/>
      <stop offset="100%" stop-color="#ff3838"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="800" fill="url(#bg-6)"/>
  <circle cx="300" cy="380" r="230" fill="url(#ink-splash)"/>

  <!-- Moon silhouette (ink wash style) -->
  <circle cx="300" cy="320" r="120" fill="#d2dae2" fill-opacity="0.12"/>

  <!-- Bamboo / Reed stalks in the rain -->
  <path d="M70 560 L100 240 L106 240 L76 560 Z" fill="#2c3444" opacity="0.6"/>
  <path d="M120 580 L140 310 L145 310 L125 580 Z" fill="#1e2532" opacity="0.8"/>
  <path d="M490 560 L470 270 L475 270 L495 560 Z" fill="#2c3444" opacity="0.6"/>
  <path d="M530 580 L515 320 L520 320 L535 580 Z" fill="#1e2532" opacity="0.8"/>

  <!-- Rain Slanted Streaks -->
  <g stroke="#ffffff" stroke-opacity="0.18" stroke-width="1.2">
    <line x1="80" y1="120" x2="50" y2="240"/>
    <line x1="160" y1="80" x2="130" y2="200"/>
    <line x1="280" y1="140" x2="250" y2="260"/>
    <line x1="390" y1="90" x2="360" y2="210"/>
    <line x1="490" y1="150" x2="460" y2="270"/>
    <line x1="120" y1="280" x2="90" y2="400"/>
    <line x1="240" y1="260" x2="210" y2="380"/>
    <line x1="380" y1="300" x2="350" y2="420"/>
    <line x1="470" y1="260" x2="440" y2="380"/>
    <line x1="180" y1="420" x2="150" y2="540"/>
    <line x1="420" y1="410" x2="390" y2="530"/>
  </g>

  <!-- Swordsman Silhouette -->
  <!-- Conical hat (nón lá) -->
  <path d="M210 395 Q300 345 390 395 L300 375 Z" fill="#090a0f"/>
  <path d="M220 395 L300 355 L380 395 Z" fill="#050608"/>
  <!-- Head & Torso -->
  <ellipse cx="300" cy="405" rx="20" ry="15" fill="#090a0f"/>
  <path d="M260 415 L340 415 L355 580 L245 580 Z" fill="#090a0f"/>
  <!-- Cloak flow -->
  <path d="M245 425 Q200 490 225 570 L255 520 Z" fill="#07080c"/>
  <path d="M355 425 Q395 480 380 565 L345 515 Z" fill="#07080c"/>
  <!-- Sword diagonally across back -->
  <line x1="240" y1="330" x2="365" y2="520" stroke="#d2dae2" stroke-width="3"/>
  <line x1="230" y1="320" x2="245" y2="340" stroke="#ff3838" stroke-width="4"/>
  <!-- Crimson ribbon from sword hilt -->
  <path d="M235 330 Q215 350 210 390" fill="none" stroke="#ff3838" stroke-width="2"/>

  <!-- Ground reflection -->
  <ellipse cx="300" cy="580" rx="140" ry="18" fill="#14171f" opacity="0.9"/>
  <ellipse cx="300" cy="580" rx="90" ry="10" fill="#ff3838" opacity="0.15"/>

  <!-- Red Chinese/Vietnamese Seal Stamp -->
  <rect x="425" y="195" width="46" height="46" rx="4" fill="#ff3838" fill-opacity="0.85"/>
  <rect x="429" y="199" width="38" height="38" rx="3" fill="none" stroke="#fff" stroke-width="1.2"/>
  <text x="448" y="224" font-family="'Lora', serif" font-size="14" font-weight="800" fill="#fff" text-anchor="middle">VÔ</text>
  <text x="448" y="238" font-family="'Lora', serif" font-size="12" font-weight="800" fill="#fff" text-anchor="middle">DANH</text>

  <!-- Top Badge -->
  <rect x="220" y="48" width="160" height="28" rx="14" fill="#ff3838" fill-opacity="0.12" stroke="#ff3838" stroke-width="1"/>
  <text x="300" y="67" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="700" fill="#ff3838" text-anchor="middle" letter-spacing="3">KIẾM HIỆP CỔ PHONG</text>

  <!-- Title & Typography -->
  <text x="300" y="650" font-family="'Lora', 'Playfair Display', Georgia, serif" font-size="36" font-weight="700" fill="url(#silver-title)" text-anchor="middle" letter-spacing="2">KIẾM KHÁCH VÔ DANH</text>
  <text x="300" y="688" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="500" fill="#a4b0be" text-anchor="middle" letter-spacing="3">MỘT ĐAO MỞ LỐI · MỘT ĐỜI TIÊU DAO</text>

  <!-- Divider -->
  <line x1="210" y1="712" x2="390" y2="712" stroke="#ff3838" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Author -->
  <text x="300" y="746" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="15" font-weight="600" fill="#f1f2f6" text-anchor="middle" letter-spacing="2">TÁC GIẢ: KIẾM VŨ</text>

  <!-- Frame border -->
  <rect x="20" y="20" width="560" height="760" rx="8" fill="none" stroke="#d2dae2" stroke-width="1" stroke-opacity="0.3"/>
  <rect x="26" y="26" width="548" height="748" rx="6" fill="none" stroke="#ff3838" stroke-width="0.6" stroke-opacity="0.25"/>
</svg>
