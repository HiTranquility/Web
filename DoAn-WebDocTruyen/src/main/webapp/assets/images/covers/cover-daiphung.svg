<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071318"/>
      <stop offset="50%" stop-color="#0e2a33"/>
      <stop offset="100%" stop-color="#1a4958"/>
    </linearGradient>
    <linearGradient id="gold-text" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f4a261"/>
      <stop offset="100%" stop-color="#2a9d8f"/>
    </linearGradient>
    <radialGradient id="center-glow" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#48cae4" stop-opacity="0.38"/>
      <stop offset="60%" stop-color="#2a9d8f" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="800" fill="url(#bg-grad)"/>
  <rect width="600" height="800" fill="url(#center-glow)"/>

  <!-- Ornate Outer Border -->
  <rect x="20" y="20" width="560" height="760" rx="8" fill="none" stroke="#f4a261" stroke-width="1.2" stroke-opacity="0.35"/>
  <rect x="26" y="26" width="548" height="748" rx="6" fill="none" stroke="#2a9d8f" stroke-width="0.8" stroke-opacity="0.25"/>

  <!-- Top Badge -->
  <rect x="180" y="46" width="240" height="30" rx="15" fill="#2a9d8f" fill-opacity="0.18" stroke="#2a9d8f" stroke-width="1.2"/>
  <text x="300" y="66" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="700" fill="#f4a261" text-anchor="middle" letter-spacing="3">TIÊN HIỆP TRINH THÁM</text>

  <!-- Thematic Vector Elements -->

          <!-- Imperial Moon -->
          <circle cx="300" cy="340" r="130" fill="#48cae4" fill-opacity="0.12" stroke="#2a9d8f" stroke-width="1.5"/>
          <circle cx="300" cy="340" r="90" fill="#f4a261" fill-opacity="0.2"/>
          <!-- Ancient Imperial Palace Roof -->
          <path d="M120 480 Q300 420 480 480 L490 520 L110 520 Z" fill="#071318" stroke="#f4a261" stroke-width="1.5"/>
          <path d="M160 440 Q300 390 440 440 L450 480 L150 480 Z" fill="#091b22" stroke="#2a9d8f" stroke-width="1"/>
          <path d="M220 390 Q300 350 380 390 L390 440 L210 440 Z" fill="#0d2833"/>
          <!-- Bronze Gong / Lantern Silhouette -->
          <circle cx="300" cy="270" r="40" fill="#071318" stroke="#f4a261" stroke-width="3"/>
          <circle cx="300" cy="270" r="28" fill="#f4a261" fill-opacity="0.3"/>
          <line x1="300" y1="180" x2="300" y2="230" stroke="#f4a261" stroke-width="2"/>
          <!-- Swirling Night Mist -->
          <path d="M-50 670 Q160 590 320 640 T650 620 L650 800 L-50 800 Z" fill="#040b0e" opacity="0.96"/>
        

  <!-- Title & Typography -->
  <text x="300" y="640" font-family="'Lora', 'Playfair Display', Georgia, serif" font-size="28" font-weight="700" fill="url(#gold-text)" text-anchor="middle" letter-spacing="1">ĐẠI PHỤNG ĐẢ CANH NHÂN</text>
  <text x="300" y="675" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="600" fill="#9aa3b5" text-anchor="middle" letter-spacing="3">DẠ HÀNH ĐẢ CANH · TRẤN QUỐC AN BANG</text>

  <!-- Accent Divider -->
  <line x1="200" y1="702" x2="400" y2="702" stroke="#2a9d8f" stroke-width="2" stroke-opacity="0.6"/>

  <!-- Author Signature -->
  <text x="300" y="738" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="600" fill="#e8eaf0" text-anchor="middle" letter-spacing="2">TÁC GIẢ: MỘC MIÊN</text>
</svg>
