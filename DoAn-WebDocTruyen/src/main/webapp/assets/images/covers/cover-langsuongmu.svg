<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091314"/>
      <stop offset="45%" stop-color="#132425"/>
      <stop offset="100%" stop-color="#1f3738"/>
    </linearGradient>
    <linearGradient id="gold-text" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <radialGradient id="center-glow" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#5eead4" stop-opacity="0.38"/>
      <stop offset="60%" stop-color="#2dd4bf" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="800" fill="url(#bg-grad)"/>
  <rect width="600" height="800" fill="url(#center-glow)"/>

  <!-- Ornate Outer Border -->
  <rect x="20" y="20" width="560" height="760" rx="8" fill="none" stroke="#e2e8f0" stroke-width="1.2" stroke-opacity="0.35"/>
  <rect x="26" y="26" width="548" height="748" rx="6" fill="none" stroke="#2dd4bf" stroke-width="0.8" stroke-opacity="0.25"/>

  <!-- Top Badge -->
  <rect x="180" y="46" width="240" height="30" rx="15" fill="#2dd4bf" fill-opacity="0.18" stroke="#2dd4bf" stroke-width="1.2"/>
  <text x="300" y="66" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="700" fill="#e2e8f0" text-anchor="middle" letter-spacing="3">TRINH THÁM RÙNG RỢN</text>

  <!-- Thematic Vector Elements -->

          <!-- Cold Moon & Fog Waves -->
          <circle cx="300" cy="300" r="90" fill="#e2e8f0" fill-opacity="0.15" stroke="#2dd4bf" stroke-width="1"/>
          <!-- Flashlight Beam -->
          <polygon points="120,560 480,240 520,380 140,620" fill="#5eead4" opacity="0.1"/>
          <!-- Spooky Pine Silhouettes -->
          <polygon points="120,360 80,480 160,480" fill="#050a0a"/>
          <polygon points="120,440 70,550 170,550" fill="#050a0a"/>
          <polygon points="460,340 420,460 500,460" fill="#070e0f"/>
          <polygon points="460,420 410,540 510,540" fill="#070e0f"/>
          <!-- Fog Ribbons -->
          <ellipse cx="250" cy="490" rx="200" ry="25" fill="#2dd4bf" opacity="0.2"/>
          <ellipse cx="380" cy="540" rx="180" ry="20" fill="#5eead4" opacity="0.25"/>
          <path d="M-50 670 Q180 610 320 660 T650 630 L650 800 L-50 800 Z" fill="#030707" opacity="0.97"/>
        

  <!-- Title & Typography -->
  <text x="300" y="640" font-family="'Lora', 'Playfair Display', Georgia, serif" font-size="28" font-weight="700" fill="url(#gold-text)" text-anchor="middle" letter-spacing="1">BÍ ẨN LÀNG SƯƠNG MÙ</text>
  <text x="300" y="675" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="600" fill="#9aa3b5" text-anchor="middle" letter-spacing="3">HỒ SƠ ĐIỀU TRA ĐỘI TRINH SÁT SỐ 4</text>

  <!-- Accent Divider -->
  <line x1="200" y1="702" x2="400" y2="702" stroke="#2dd4bf" stroke-width="2" stroke-opacity="0.6"/>

  <!-- Author Signature -->
  <text x="300" y="738" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="600" fill="#e8eaf0" text-anchor="middle" letter-spacing="2">TÁC GIẢ: MỘC MIÊN</text>
</svg>
