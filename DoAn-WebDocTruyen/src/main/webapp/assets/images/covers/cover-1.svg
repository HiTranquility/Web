<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0e17"/>
      <stop offset="45%" stop-color="#141a29"/>
      <stop offset="100%" stop-color="#241938"/>
    </linearGradient>
    <linearGradient id="blade-glow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f0863a" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ff9d55" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="gold-text" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffd56b"/>
      <stop offset="50%" stop-color="#ffa938"/>
      <stop offset="100%" stop-color="#f0863a"/>
    </linearGradient>
    <radialGradient id="sun-glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#f0863a" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#8b7cf6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="800" fill="url(#bg-1)"/>
  <rect width="600" height="800" fill="url(#sun-glow)"/>

  <!-- Celestial Rings & Runes -->
  <circle cx="300" cy="380" r="180" fill="none" stroke="#f0863a" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="8 6"/>
  <circle cx="300" cy="380" r="150" fill="none" stroke="#8b7cf6" stroke-width="1" stroke-opacity="0.25"/>
  <circle cx="300" cy="380" r="120" fill="none" stroke="#fff" stroke-width="0.8" stroke-opacity="0.2" stroke-dasharray="4 8"/>

  <!-- Mountain Silhouettes -->
  <path d="M-50 680 L140 460 L280 620 L440 430 L650 680 L650 800 L-50 800 Z" fill="#080a10" opacity="0.95"/>
  <path d="M40 700 L210 520 L350 660 L490 510 L630 670 L630 800 L40 800 Z" fill="#101422" opacity="0.8"/>

  <!-- Glowing Sword Beam -->
  <polygon points="296,160 304,160 306,490 294,490" fill="url(#blade-glow)"/>
  <polygon points="275,490 325,490 320,505 280,505" fill="#f0863a"/>
  <polygon points="295,505 305,505 303,570 297,570" fill="#cbd5e1"/>
  <circle cx="300" cy="580" r="10" fill="#f0863a"/>

  <!-- Sparks / Stars -->
  <circle cx="180" cy="260" r="2" fill="#ffd56b" opacity="0.8"/>
  <circle cx="420" cy="220" r="2.5" fill="#ffd56b" opacity="0.9"/>
  <circle cx="150" cy="390" r="1.5" fill="#fff" opacity="0.7"/>
  <circle cx="450" cy="350" r="2" fill="#ff9d55" opacity="0.75"/>
  <circle cx="280" cy="210" r="3" fill="#fff" opacity="0.9"/>

  <!-- Top Banner / Badge -->
  <rect x="220" y="48" width="160" height="28" rx="14" fill="#f0863a" fill-opacity="0.15" stroke="#f0863a" stroke-width="1"/>
  <text x="300" y="67" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffa938" text-anchor="middle" letter-spacing="3">TIÊN HIỆP ĐỈNH CAO</text>

  <!-- Title & Typography -->
  <text x="300" y="650" font-family="'Lora', 'Playfair Display', Georgia, serif" font-size="34" font-weight="700" fill="url(#gold-text)" text-anchor="middle" letter-spacing="1">KIẾM KHÍ TRƯỜNG SINH</text>
  <text x="300" y="685" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="500" fill="#9aa3b5" text-anchor="middle" letter-spacing="4">TRƯỜNG THIÊN KIẾM TIÊN</text>

  <!-- Divider line -->
  <line x1="210" y1="710" x2="390" y2="710" stroke="#f0863a" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- Author -->
  <text x="300" y="745" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="15" font-weight="600" fill="#e8eaf0" text-anchor="middle" letter-spacing="2">TÁC GIẢ: KIẾM VŨ</text>

  <!-- Border ornament frame -->
  <rect x="20" y="20" width="560" height="760" rx="8" fill="none" stroke="#f0863a" stroke-width="1.2" stroke-opacity="0.3"/>
  <rect x="26" y="26" width="548" height="748" rx="6" fill="none" stroke="#8b7cf6" stroke-width="0.6" stroke-opacity="0.2"/>
</svg>
